name: Android Native Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build ANGLE (in-process GLES backend) for Android arm64-v8a.
  # Output: libEGL.so / libGLESv2.so copied into app/src/main/jniLibs/.
  # ---------------------------------------------------------------------------
  build-angle:
    name: Build ANGLE for Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK (for NDK path used by ANGLE build)
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          accept-licenses: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y git python3 ninja-build

      - name: Get depot_tools
        run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools

      - name: Get ANGLE source
        run: git clone --depth 1 https://chromium.googlesource.com/angle/angle.git $HOME/angle

      - name: Restore ANGLE cache
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: angle-arm64-v8a-v1

      - name: Ensure Python for ANGLE bootstrap
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y python3 python-is-python3

      - name: Bootstrap ANGLE build tools
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: cd $HOME/angle && python3 scripts/bootstrap.py
        env:
          PATH: $HOME/depot_tools:$PATH

      - name: Generate ANGLE build (Android arm64-v8a)
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: cd $HOME/angle && gn gen out/Release --args='target_os="android" target_cpu="arm64" is_debug=false'
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: $HOME/depot_tools:$PATH

      - name: Build ANGLE libraries (libEGL, libGLESv2)
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: ninja -C $HOME/angle/out/Release libEGL libGLESv2
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: $HOME/depot_tools:$PATH

      - name: Copy ANGLE shared libraries into jniLibs
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          find $HOME/angle/out/Release \( -name 'libEGL.so' -o -name 'libGLESv2.so' \) -print -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Save ANGLE cache
        if: steps.cache-angle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: angle-arm64-v8a-v1

  # ---------------------------------------------------------------------------
  # Assemble the debug APK. ANGLE libs are restored from cache (or produced by
  # build-angle above) and linked by CMake into libangledpaper.so.
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build debug APK
    needs: build-angle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore ANGLE shared libraries
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: angle-arm64-v8a-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          accept-licenses: true

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14
