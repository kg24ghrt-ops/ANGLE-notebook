
name: Android Native Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD ANGLE
  # Android arm64-v8a
  # ============================================================

  build-angle:
    name: Build ANGLE (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANGLE_REF: main

    steps:

      - name: Checkout ANGLE
        id: angle-source
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "$ANGLE_REF" \
            https://chromium.googlesource.com/angle/angle.git \
            "$RUNNER_TEMP/angle"

          ANGLE_COMMIT="$(git -C "$RUNNER_TEMP/angle" rev-parse HEAD)"

          echo "commit=$ANGLE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "ANGLE revision: $ANGLE_COMMIT"

      # --------------------------------------------------------
      # ANGLE binary cache
      # --------------------------------------------------------

      - name: Restore ANGLE binary cache
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/angle-artifact/arm64-v8a
          key: angle-ubuntu24-arm64-vulkan-release-v1-${{ steps.angle-source.outputs.commit }}

      # --------------------------------------------------------
      # Install depot_tools
      # --------------------------------------------------------

      - name: Install depot_tools
        if: steps.angle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # Bootstrap and synchronize ANGLE
      # --------------------------------------------------------

      - name: Bootstrap ANGLE
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          python3 scripts/bootstrap.py

      - name: Synchronize ANGLE dependencies
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          gclient sync --nohooks

      # --------------------------------------------------------
      # Linux build dependencies
      # --------------------------------------------------------

      - name: Install native build dependencies
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          sudo ./build/install-build-deps.sh

          gclient runhooks

      # --------------------------------------------------------
      # Generate GN configuration
      # --------------------------------------------------------

      - name: Generate ANGLE build configuration
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "arm64"
            arm_control_flow_integrity = "none"
            is_component_build = false
            is_debug = false
            angle_enable_vulkan = true
          '

      # --------------------------------------------------------
      # Compile ANGLE
      # --------------------------------------------------------

      - name: Build ANGLE libraries
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          autoninja -C out/Android libEGL libGLESv2

      # --------------------------------------------------------
      # Collect native libraries
      # --------------------------------------------------------

      - name: Collect ANGLE libraries
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          OUTPUT="$RUNNER_TEMP/angle-artifact/arm64-v8a"

          mkdir -p "$OUTPUT"

          for library in libEGL.so libGLESv2.so; do
            SOURCE="out/Android/$library"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing ANGLE output: $SOURCE"
              exit 1
            fi

            install -m 0644 "$SOURCE" "$OUTPUT/$library"
          done

          ls -lh "$OUTPUT"

      # --------------------------------------------------------
      # Validate cache or freshly compiled libraries
      # --------------------------------------------------------

      - name: Verify ANGLE outputs
        shell: bash
        run: |
          OUTPUT="$RUNNER_TEMP/angle-artifact/arm64-v8a"

          for library in libEGL.so libGLESv2.so; do
            if [ ! -s "$OUTPUT/$library" ]; then
              echo "::error::Missing or empty library: $library"
              exit 1
            fi

            echo "Verified: $library"
          done

      # --------------------------------------------------------
      # Transfer libraries to APK job
      # --------------------------------------------------------

      - name: Upload ANGLE libraries
        uses: actions/upload-artifact@v4
        with:
          name: angle-libs-arm64-v8a
          path: ${{ runner.temp }}/angle-artifact/
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # BUILD ANDROID APK
  # ============================================================

  build-apk:
    name: Assemble Android APK
    needs: build-angle
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download ANGLE libraries
      # --------------------------------------------------------

      - name: Download ANGLE libraries
        uses: actions/download-artifact@v4
        with:
          name: angle-libs-arm64-v8a
          path: ${{ runner.temp }}/angle-artifact

      # --------------------------------------------------------
      # Install ANGLE libraries
      # --------------------------------------------------------

      - name: Install ANGLE native libraries
        shell: bash
        run: |
          SOURCE="$RUNNER_TEMP/angle-artifact/arm64-v8a"
          DEST="app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$DEST"

          for library in libEGL.so libGLESv2.so; do
            if [ ! -s "$SOURCE/$library" ]; then
              echo "::error::Missing ANGLE artifact: $library"
              exit 1
            fi
          done

          cp -v "$SOURCE/"*.so "$DEST/"

          ls -lh "$DEST"

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # --------------------------------------------------------
      # Verify packaged ANGLE libraries
      # --------------------------------------------------------

      - name: Verify APK native libraries
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          for library in libEGL.so libGLESv2.so; do
            if ! unzip -l "$APK" | grep -F \
              "lib/arm64-v8a/$library" >/dev/null; then
              echo "::error::APK is missing $library"
              exit 1
            fi

            echo "APK contains $library"
          done

      # --------------------------------------------------------
      # Upload final APK
      # --------------------------------------------------------

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
