
name: Android Native Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD ANGLE
  # Target: Android arm64-v8a
  # Output: libEGL.so + libGLESv2.so
  # ============================================================

  build-angle:
    name: Build ANGLE (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANGLE_DIR: ${{ runner.temp }}/angle
      ANGLE_REF: main
      ANGLE_OUTPUT_DIR: ${{ runner.temp }}/angle-artifact/arm64-v8a

    steps:

      # --------------------------------------------------------
      # Fetch ANGLE source
      # --------------------------------------------------------

      - name: Checkout ANGLE
        id: angle-source
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "$ANGLE_REF" \
            https://chromium.googlesource.com/angle/angle.git \
            "$ANGLE_DIR"

          ANGLE_COMMIT="$(git -C "$ANGLE_DIR" rev-parse HEAD)"

          echo "commit=$ANGLE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "ANGLE revision: $ANGLE_COMMIT"

      # --------------------------------------------------------
      # Cache compiled ANGLE libraries
      #
      # The source commit is part of the key.
      # Bump v1 if the GN configuration changes.
      # --------------------------------------------------------

      - name: Restore ANGLE binary cache
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/angle-artifact/arm64-v8a
          key: angle-ubuntu24-arm64-vulkan-release-v1-${{ steps.angle-source.outputs.commit }}

      # --------------------------------------------------------
      # Install Chromium depot_tools
      # --------------------------------------------------------

      - name: Install depot_tools
        if: steps.angle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # Bootstrap ANGLE and retrieve dependencies
      # --------------------------------------------------------

      - name: Synchronize ANGLE dependencies
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          python3 scripts/bootstrap.py

          gclient sync --nohooks

      # --------------------------------------------------------
      # Install Linux build dependencies
      # --------------------------------------------------------

      - name: Install native build dependencies
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          sudo ./build/install-build-deps.sh

          gclient runhooks

      # --------------------------------------------------------
      # Generate Android ARM64 build
      # --------------------------------------------------------

      - name: Generate ANGLE build configuration
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "arm64"

            arm_control_flow_integrity = "none"

            is_component_build = false
            is_debug = false

            angle_enable_vulkan = true
          '

      # --------------------------------------------------------
      # Compile ANGLE
      # --------------------------------------------------------

      - name: Build ANGLE shared libraries
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          autoninja -C out/Android libEGL libGLESv2

      # --------------------------------------------------------
      # Stage compiled libraries
      # --------------------------------------------------------

      - name: Collect ANGLE libraries
        if: steps.angle-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/angle
        shell: bash
        run: |
          mkdir -p "$ANGLE_OUTPUT_DIR"

          for library in libEGL.so libGLESv2.so; do
            SOURCE="out/Android/$library"
            DEST="$ANGLE_OUTPUT_DIR/$library"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing ANGLE output: $SOURCE"
              exit 1
            fi

            install -m 0644 "$SOURCE" "$DEST"
          done

      # --------------------------------------------------------
      # Validate cached or freshly compiled libraries
      # --------------------------------------------------------

      - name: Verify ANGLE outputs
        shell: bash
        run: |
          for library in libEGL.so libGLESv2.so; do
            FILE="$ANGLE_OUTPUT_DIR/$library"

            if [ ! -s "$FILE" ]; then
              echo "::error::Missing or empty library: $FILE"
              exit 1
            fi

            echo "Verified: $FILE"
          done

      # --------------------------------------------------------
      # Transfer libraries to the APK build job
      # --------------------------------------------------------

      - name: Upload ANGLE libraries
        uses: actions/upload-artifact@v7
        with:
          name: angle-libs-arm64-v8a
          path: ${{ runner.temp }}/angle-artifact/
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # BUILD ANDROID APPLICATION
  # Receives ANGLE libraries from build-angle.
  # ============================================================

  build-apk:
    name: Assemble Android APK
    needs: build-angle
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # --------------------------------------------------------
      # Checkout application
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # --------------------------------------------------------
      # Download ANGLE libraries
      # --------------------------------------------------------

      - name: Download ANGLE libraries
        uses: actions/download-artifact@v8.0.2
        with:
          name: angle-libs-arm64-v8a
          path: ${{ runner.temp }}/angle-artifact

      # --------------------------------------------------------
      # Install ANGLE into Android jniLibs
      # --------------------------------------------------------

      - name: Install ANGLE native libraries
        shell: bash
        run: |
          SOURCE="$RUNNER_TEMP/angle-artifact/arm64-v8a"
          DEST="app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$DEST"

          for library in libEGL.so libGLESv2.so; do
            if [ ! -s "$SOURCE/$library" ]; then
              echo "::error::Missing ANGLE artifact: $library"
              exit 1
            fi
          done

          cp -v "$SOURCE/"*.so "$DEST/"

          ls -lh "$DEST"

      # --------------------------------------------------------
      # Java toolchain
      # --------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      # --------------------------------------------------------
      # Gradle configuration and caching
      # --------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # --------------------------------------------------------
      # Verify ANGLE is included in the APK
      # --------------------------------------------------------

      - name: Verify APK native libraries
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          for library in libEGL.so libGLESv2.so; do
            if ! unzip -l "$APK" | grep -F \
              "lib/arm64-v8a/$library" >/dev/null; then
              echo "::error::APK is missing $library"
              exit 1
            fi

            echo "APK contains $library"
          done

      # --------------------------------------------------------
      # Upload final APK
      # --------------------------------------------------------

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
